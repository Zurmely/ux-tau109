<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Timer — TAU109 — UX</title>
<style>
body{margin:0;background:#fff;color:#000;font-family:Helvetica,Arial,sans-serif;display:flex;min-height:100vh;align-items:center;justify-content:center}
main{padding:2rem;width:100%;max-width:1400px;text-align:center}
h1{font-size:3rem;margin:0 0 .25rem}
p{font-size:1.25rem;margin:0 0 1.5rem}
button{font-family:inherit;color:#000;background:#fff;border:2px solid #000;padding:1rem 1.5rem;margin:.25rem;font-size:1.5rem;font-weight:bold;cursor:pointer}
button:hover,button.on{background:#000;color:#fff}
#t{font-size:clamp(6rem,20vw,40vh);font-weight:bold;font-variant-numeric:tabular-nums;line-height:1;margin:1.5rem 0}
#msg{font-size:3rem;font-weight:bold;min-height:3.5rem;margin:0}
body.end{animation:f 1s steps(1) infinite}
body.end button{border-color:currentColor}
@keyframes f{0%{background:#000;color:#fff}50%{background:#fff;color:#000}}
</style>
</head>
<body>
<main>
<h1>TAU109 — UX</h1>
<p>17/10 · Timer</p>
<div>
<button data-m="30" class="on">Parte 1 – Auto Layout</button>
<button data-m="15">Parte 2 – Prototipação</button>
</div>
<div id="t">30:00</div>
<p id="msg" aria-live="assertive"></p>
<div>
<button id="go">Iniciar</button>
<button id="rs">Reiniciar</button>
<button id="fs">Tela cheia</button>
</div>
</main>
<script>
var dur=30*60e3,left=dur,end=0,run=false,iv,ac,beeping;
var $=function(s){return document.querySelector(s)},T=$('#t'),G=$('#go'),M=$('#msg');
function fmt(ms){var s=Math.ceil(ms/1e3);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function draw(){T.textContent=fmt(left);document.title=fmt(left)+' — Timer TAU109'}
function audio(){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();ac.resume()}catch(e){}}
function beep(){if(!ac)return;for(var i=0;i<6;i++){var o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+i*.5;o.frequency.value=880;o.type='square';g.gain.setValueAtTime(.3,t);g.gain.setValueAtTime(0,t+.3);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+.3)}}
function tick(){left=Math.max(0,end-Date.now());draw();if(left<=0)done()}
function done(){stop();document.body.classList.add('end');M.textContent='Tempo esgotado!';beep()}
function stop(){run=false;clearInterval(iv);G.textContent='Iniciar'}
function toggle(){audio();if(run){tick();stop();return}if(left<=0)return;end=Date.now()+left;run=true;G.textContent='Pausar';iv=setInterval(tick,200)}
function reset(){stop();left=dur;document.body.classList.remove('end');M.textContent='';draw()}
document.querySelectorAll('[data-m]').forEach(function(b){b.onclick=function(){audio();document.querySelectorAll('[data-m]').forEach(function(x){x.classList.remove('on')});b.classList.add('on');dur=b.dataset.m*60e3;reset()}});
G.onclick=toggle;$('#rs').onclick=reset;
$('#fs').onclick=function(){var d=document;if(d.fullscreenElement)d.exitFullscreen();else d.documentElement.requestFullscreen&&d.documentElement.requestFullscreen()};
document.addEventListener('visibilitychange',function(){if(run)tick()});
document.addEventListener('keydown',function(e){if(e.code==='Space'){e.preventDefault();toggle()}else if(e.key==='r'||e.key==='R')reset()});
document.querySelectorAll('button').forEach(function(b){b.addEventListener('keydown',function(e){if(e.code==='Space')e.preventDefault()})});
draw();
</script>
</body>
</html>
